# Supabase project config
# https://supabase.com/docs/guides/cli/config

# ── Edge function settings ────────────────────────────────────────────────────
# The cron-invoked functions below are called by pg_net from inside the
# database. pg_net sends a plain HTTP POST with no Authorization header, so we
# disable JWT verification for these functions only. They are safe to open:
# all use the service-role key internally and only write to our own tables.

[functions.sync-tokenstr]
verify_jwt = false

[functions.sync-market-prices]
verify_jwt = false

# checks-webhook, tokenstr-webhook, and credits-webhook are all called
# externally by Alchemy, which sends only an x-alchemy-signature header (no
# Supabase JWT/apikey). The platform's verify_jwt gate rejects those
# requests with 401 before the function's own HMAC signature check ever
# runs, so it must be disabled here for all three — the HMAC check in each
# function's own code is what actually authenticates the request.
[functions.checks-webhook]
verify_jwt = false

[functions.tokenstr-webhook]
verify_jwt = false

[functions.credits-webhook]
verify_jwt = false

# sync-editions-prices and sync-checkmath are also called by pg_net from
# inside the database (same reasoning as sync-tokenstr/sync-market-prices
# above) — no Authorization header, so verify_jwt must be disabled here too.
[functions.sync-editions-prices]
verify_jwt = false

[functions.sync-checkmath]
verify_jwt = false
