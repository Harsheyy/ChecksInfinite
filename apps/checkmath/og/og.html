<!doctype html>
<!--
  Source for apps/checkmath/public/og.png (1200×630 social card).

  Deliberately static: the card ships in the bundle, so putting live prices
  on it would guarantee that every link ever posted shows whatever the
  numbers happened to be at build time. It states the question instead.

  Regenerate after editing:
    node apps/checkmath/og/render.mjs
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: 'Courier New', Courier, monospace;
        background: #0a0a0a;
        color: #eeeeee;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
      }

      .mark {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #999999;
        font-size: 22px;
        letter-spacing: 0.1em;
        margin-bottom: 44px;
      }
      .mark svg { display: block; }

      h1 {
        font-size: 82px;
        font-weight: 400;
        letter-spacing: 0.01em;
        line-height: 1.05;
      }

      .tagline {
        margin-top: 28px;
        font-size: 38px;
        line-height: 1.4;
        color: #999999;
        max-width: 26ch;
        text-wrap: balance;
      }
      .tagline b { color: #b5f13b; font-weight: 400; }

      .rule {
        width: 100%;
        height: 1px;
        background: #333333;
        margin: 52px 0 28px;
      }

      .url {
        font-size: 24px;
        letter-spacing: 0.08em;
        color: #777777;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg viewBox="0 0 36 36" width="26" height="26">
        <path fill-rule="evenodd" d="M21.36 9.886A3.933 3.933 0 0 0 18 8c-1.423 0-2.67.755-3.36 1.887a3.935 3.935 0 0 0-4.753 4.753A3.933 3.933 0 0 0 8 18c0 1.423.755 2.669 1.886 3.36a3.935 3.935 0 0 0 4.753 4.753 3.933 3.933 0 0 0 4.863 1.59 3.953 3.953 0 0 0 1.858-1.589 3.935 3.935 0 0 0 4.753-4.754A3.933 3.933 0 0 0 28 18a3.933 3.933 0 0 0-1.887-3.36 3.934 3.934 0 0 0-1.042-3.711 3.934 3.934 0 0 0-3.71-1.043Zm-3.958 11.713 4.562-6.844c.566-.846-.751-1.724-1.316-.878l-4.026 6.043-1.371-1.368c-.717-.722-1.836.396-1.116 1.116l2.17 2.15a.788.788 0 0 0 1.097-.22Z" fill="#ffffff"/>
      </svg>
      CHECKS.WIKI
    </div>

    <h1>Checkmath</h1>
    <p class="tagline">Buy one Check outright, or <b>compose one</b>?</p>

    <div class="rule"></div>
    <p class="url">calc.checks.wiki</p>
  </body>
</html>
